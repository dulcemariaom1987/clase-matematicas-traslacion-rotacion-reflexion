<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clase: Traslación, Rotación y Reflexión</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff4c2;--bg2:#cfeeff;--card:#fff;--ink:#25235a;--pri:#7c4dff;--ok:#0e8a45;--bad:#d61f4b;--soft:#f1eeff;--line:#d6cffa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1e1b4b;--bg2:#0f3550;--card:#2b2961;--ink:#f5f3ff;--ok:#5ee09a;--bad:#ff7a9a;--soft:#37347a;--line:#4b4896}}
:root[data-theme="dark"]{--bg1:#1e1b4b;--bg2:#0f3550;--card:#2b2961;--ink:#f5f3ff;--ok:#5ee09a;--bad:#ff7a9a;--soft:#37347a;--line:#4b4896}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-size:1.1rem;line-height:1.45;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed}
.hero{background:linear-gradient(120deg,#7c4dff,#ff4d8d,#ff9f1c);color:#fff;text-align:center;padding:1.6rem 1rem 1.2rem;border-radius:0 0 2rem 2rem}
.hero h1{margin:.2rem 0;font-size:clamp(1.8rem,6vw,3.2rem);font-weight:800;animation:bob 2s ease-in-out infinite}
.hero p{margin:.2rem auto;max-width:36rem}
.hud{display:flex;gap:.8rem;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:.6rem}
.bar{flex:1 1 12rem;max-width:20rem;height:1rem;background:rgba(255,255,255,.35);border-radius:1rem;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:#ffe14d;transition:width .5s}
.pill{background:rgba(255,255,255,.25);border:2px solid #fff;color:#fff;border-radius:2rem;padding:.2rem .9rem;font:inherit;cursor:pointer}
nav{display:flex;gap:.5rem;overflow-x:auto;padding:.8rem 1rem;max-width:62rem;margin:auto}
nav a{flex:none;background:var(--card);color:var(--ink);text-decoration:none;border:3px solid var(--line);border-radius:2rem;padding:.2rem .9rem;font-weight:700}
nav a:hover,nav a:focus-visible{border-color:var(--pri)}
.wrap{max-width:62rem;margin:auto;padding:0 1rem 3rem}
section{margin-top:1.6rem}
section>h2{font-size:clamp(1.5rem,4.5vw,2.2rem);margin:.4rem 0;font-weight:800}
.card{background:var(--card);border:3px solid var(--line);border-radius:1.4rem;padding:1rem 1.1rem;margin:.9rem 0}
.card h3,.card h4{margin:.1rem 0 .5rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.8rem}
.mv{border-radius:1.2rem;padding:.8rem 1rem;color:#fff}
.mv.t{background:#2d9cdb}.mv.r{background:#d6336c}.mv.f{background:#0e8a45}
.mv b{font-size:1.3rem}
.fig{display:inline-block;font-size:2.8rem;line-height:1;transition:transform .6s}
.stage{height:9rem;display:flex;align-items:center;padding:0 2rem;background:var(--soft);border-radius:1.2rem;margin:.6rem 0;overflow:hidden}
.stage .fig{font-size:4.5rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin:.6rem 0}
.btn{font:inherit;font-weight:800;color:#fff;background:linear-gradient(120deg,#7c4dff,#ff4d8d);border:0;border-radius:2rem;padding:.55rem 1.2rem;cursor:pointer;min-height:2.8rem;transition:transform .15s}
.btn:hover{transform:scale(1.05)}.btn:active{transform:scale(.95)}
.btn.alt{background:#2d9cdb}.btn.gray{background:#6b6a8f}
:focus-visible{outline:4px solid #ffb300;outline-offset:2px}
.stem{display:flex;justify-content:center;padding:.4rem;font-size:1.3rem}
.stem .fig{font-size:4rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.7rem;margin:.6rem 0}
.opt{font:inherit;color:var(--ink);background:var(--soft);border:3px solid var(--line);border-radius:1rem;padding:.6rem;min-height:5.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;transition:transform .15s}
.opt:hover{transform:translateY(-3px)}
.opt.sel{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri)}
.pair{display:flex;align-items:center;gap:.4rem}
.mir{display:flex;align-items:center;gap:.3rem}
.mir i{background:var(--pri);border-radius:2px;position:relative}
.mir i::after{content:"L";position:absolute;font:800 .8rem/1 inherit;font-style:normal;color:var(--pri)}
.mir.v i{width:4px;height:3.6rem}.mir.v i::after{top:-1rem;left:-.2rem}
.mir.h{flex-direction:column}.mir.h i{height:4px;width:5rem}.mir.h i::after{right:-1rem;top:-.4rem}
.mir .fig{font-size:2.4rem}
textarea{display:block;width:100%;min-height:4.6rem;margin:.4rem 0;padding:.6rem .8rem;font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:1rem;resize:vertical}
textarea:focus{border-color:var(--pri);outline:none}
.fb{min-height:1.5rem;margin:.3rem 0;font-weight:700}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.shake{animation:shake .4s}
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:21rem;margin:.6rem auto}
.cell{aspect-ratio:1;background:var(--soft);border-radius:.4rem;display:grid;place-items:center;font-size:clamp(1rem,5vw,1.5rem)}
.cell.t{background:#ff8fa3}
.pad{display:grid;grid-template-columns:repeat(4,3.4rem);gap:.4rem;justify-content:center}
.pad .btn{padding:.3rem}
.score{font-size:1.3rem;font-weight:800;text-align:center}
.conf{position:fixed;pointer-events:none;font-size:1.7rem;z-index:50;animation:fly 1s ease-out forwards}
.float{position:fixed;font-size:2rem;opacity:.35;pointer-events:none;z-index:0;animation:drift 9s ease-in-out infinite}
.wrap,.hero,nav{position:relative;z-index:1}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
@keyframes drift{50%{transform:translateY(-30px) rotate(15deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<span class="float" style="left:3%;top:30%" aria-hidden="true">⭐</span>
<span class="float" style="right:4%;top:55%;animation-delay:2s" aria-hidden="true">🪞</span>
<span class="float" style="left:6%;top:80%;animation-delay:4s" aria-hidden="true">🎡</span>
<header class="hero">
  <div style="font-size:2.5rem" aria-hidden="true">🛹 🎡 🪞</div>
  <h1>¡Los movimientos mágicos!</h1>
  <p>Traslación, rotación y reflexión: aprende, juega y gana estrellas.</p>
  <div class="hud">
    <span>⭐ <b id="stars">0</b> de <span id="total">0</span></span>
    <div class="bar" role="progressbar" aria-label="Progreso"><span id="fill"></span></div>
    <button class="pill" id="mute" type="button">🔊 Sonido</button>
  </div>
</header>
<nav id="nav" aria-label="Secciones"></nav>
<main class="wrap" id="app"></main>

<script>
"use strict";
/* ===== Utilidades ===== */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

/* ===== Sonido ===== */
const Sound = {
  on: true, ctx: null,
  tone(f, t, d, type = "sine") {
    if (!this.on) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + t;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.12, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
      o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + d);
    } catch (e) { /* sin audio disponible */ }
  },
  ok() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * 0.09, 0.18)); },
  bad() { this.tone(200, 0, 0.3, "sawtooth"); },
  pop() { this.tone(520, 0, 0.07); }
};

/* ===== Progreso ===== */
const Progress = {
  ids: new Set(), done: new Set(),
  register(id) { this.ids.add(id); },
  award(id) { if (!this.done.has(id)) { this.done.add(id); this.paint(); } },
  paint() {
    $("#stars").textContent = this.done.size;
    $("#total").textContent = this.ids.size;
    $("#fill").style.width = (this.ids.size ? 100 * this.done.size / this.ids.size : 0) + "%";
  }
};

/* ===== Retroalimentación ===== */
const GOOD = ["¡Excelente! 🎉", "¡Eres un crack de la geometría! 🌟", "¡Correcto! ¡Qué buen ojo! 👀", "¡Genial, lo lograste! 🚀"];
const TRY = ["Casi… mira de nuevo con calma 🔍", "¡Todavía no! Inténtalo otra vez 💪", "Ups, revisa con cuidado y prueba de nuevo 🤔"];
function confetti(node) {
  const r = node.getBoundingClientRect();
  for (let i = 0; i < 12; i++) {
    const s = el("span", "conf", pick(["🎉", "⭐", "✨", "🎈"]));
    s.style.left = r.left + r.width / 2 + "px"; s.style.top = r.top + "px";
    s.style.setProperty("--dx", (Math.random() * 300 - 150) + "px");
    s.style.setProperty("--dy", (-60 - Math.random() * 160) + "px");
    document.body.append(s); setTimeout(() => s.remove(), 1000);
  }
}
function verdict(card, ok, id, extra) {
  const fb = $(".fb", card);
  fb.className = "fb " + (ok ? "ok" : "bad");
  fb.textContent = ok ? pick(GOOD) : (extra || pick(TRY));
  if (ok) { Sound.ok(); confetti(fb); Progress.award(id); }
  else { Sound.bad(); card.classList.add("shake"); setTimeout(() => card.classList.remove("shake"), 450); }
}

/* ===== Figuras ===== */
const E = (e, t = "") => `<span class="fig" style="transform:${t}">${e}</span>`;
const PAIR = (e, t) => `<div class="pair">${E(e)}<b>➜</b>${E(e, t)}</div>`;
const MIR = (e, axis, t) => `<div class="mir ${axis}">${E(e)}<i></i>${E(e, t)}</div>`;

/* ===== Constructores de ejercicios ===== */
function choiceItem(host, it) {
  Progress.register(it.id);
  const card = el("div", "card");
  card.innerHTML = `<h4>${it.q}</h4>${it.stem ? `<div class="stem">${it.stem}</div>` : ""}<div class="opts"></div><div class="row"><button class="btn" type="button">Verificar ✅</button></div><p class="fb" aria-live="polite"></p>`;
  const box = $(".opts", card); let sel = null;
  shuffle(it.opts).forEach(([html, ok]) => {
    const b = el("button", "opt", html); b.type = "button";
    b.onclick = () => { Sound.pop(); box.querySelectorAll(".opt").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = { ok }; };
    box.append(b);
  });
  $(".btn", card).onclick = () => {
    if (!sel) { $(".fb", card).className = "fb bad"; $(".fb", card).textContent = "Primero elige una opción 👆"; return; }
    verdict(card, sel.ok, it.id);
  };
  host.append(card);
}
function textItem(host, it) {
  Progress.register(it.id);
  const card = el("div", "card");
  card.innerHTML = `<h4>${it.q}</h4>${it.stem ? `<div class="stem">${it.stem}</div>` : ""}<textarea aria-label="Tu respuesta" placeholder="Escribe aquí tu respuesta…"></textarea><div class="row"><button class="btn" type="button">Verificar ✅</button></div><p class="fb" aria-live="polite"></p>`;
  $(".btn", card).onclick = () => {
    const txt = norm($("textarea", card).value.trim());
    if (txt.length < 4) { $(".fb", card).className = "fb bad"; $(".fb", card).textContent = "Escribe tu respuesta primero ✏️"; return; }
    verdict(card, it.groups.every(g => g.some(w => txt.includes(w))), it.id, it.hint);
  };
  host.append(card);
}
function freeItem(host, it) {
  Progress.register(it.id);
  const card = el("div", "card");
  card.innerHTML = `<h4>${it.q}</h4>${"<textarea aria-label='Ejemplo' placeholder='Escribe tu ejemplo…'></textarea>".repeat(2)}<div class="row"><button class="btn" type="button">Verificar ✅</button></div><p class="fb" aria-live="polite"></p>`;
  $(".btn", card).onclick = () => {
    const ok = [...card.querySelectorAll("textarea")].every(t => t.value.trim().length >= 8);
    verdict(card, ok, it.id, "Escribe los dos ejemplos con una frase completa ✏️");
  };
  host.append(card);
}

/* ===== Fábricas de preguntas ===== */
const sizeItem = (id, e) => ({ k: "choice", id, q: "Observa la imagen destacada y elige la que mantiene la misma forma y tamaño.", stem: E(e), opts: [
  [E(e, "translate(10px,-6px)"), 1], [E(e, "scale(1.8)"), 0], [E(e, "scale(.5)"), 0], [E(e, "scale(1.9,.7)"), 0]] });
const transItem = (id, e) => ({ k: "choice", id, q: "Elige la imagen que fue SOLO trasladada.", opts: [
  [PAIR(e, ""), 1], [PAIR(e, "rotate(90deg)"), 0], [PAIR(e, "scaleX(-1)"), 0]] });
const reflItem = (id, e, axis) => {
  const good = axis === "v" ? "scaleX(-1)" : "scaleY(-1)", bad = axis === "v" ? "scaleY(-1)" : "scaleX(-1)";
  return { k: "choice", id, q: `Elige la imagen que es una reflexión respecto al eje L (la línea morada).`, opts: [
    [MIR(e, axis, good), 1], [MIR(e, axis, ""), 0], [MIR(e, axis, bad), 0], [MIR(e, axis, "rotate(180deg)"), 0]] };
};
const rotItem = (id, e, deg) => ({ k: "choice", id, q: "Elige la imagen que muestra una ROTACIÓN.", opts: [
  [PAIR(e, `rotate(${deg}deg)`), 1], [PAIR(e, ""), 0], [PAIR(e, "scaleX(-1)"), 0], [PAIR(e, "scale(1.7)"), 0]] });
const typeItem = (id, e, t, ans) => ({ k: "choice", id, q: "¿Qué movimiento ocurrió?", stem: PAIR(e, t),
  opts: ["Traslación", "Rotación", "Reflexión"].map((n, i) => [n, i === ans ? 1 : 0]) });

/* ===== Trayectos ===== */
const N = 7;
const DIRS = { R: [0, 1, "a la derecha"], L: [0, -1, "a la izquierda"], U: [-1, 0, "hacia arriba"], D: [1, 0, "hacia abajo"] };
const walk = (s, moves) => { let [r, c] = s; const p = [[r, c]]; moves.forEach(([d, n]) => { for (let i = 0; i < n; i++) { r += DIRS[d][0]; c += DIRS[d][1]; p.push([r, c]); } }); return p; };
const sentence = m => { const a = m.map(([d, n]) => `${n} cuadrado${n > 1 ? "s" : ""} ${DIRS[d][2]}`); return a.length > 1 ? a.slice(0, -1).join(", ") + " y " + a[a.length - 1] : a[0]; };
const compress = ds => ds.reduce((acc, d) => { const l = acc[acc.length - 1]; if (l && l[0] === d) l[1]++; else acc.push([d, 1]); return acc; }, []);
const same = (a, b) => a[0] === b[0] && a[1] === b[1];
function boardHtml(trail, pos, start, target) {
  let h = "";
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const p = [r, c];
    const icon = same(p, pos) ? "🧑" : same(p, target) ? "🎯" : same(p, start) ? "🏁" : "";
    h += `<div class="cell${trail.some(q => same(q, p)) ? " t" : ""}">${icon}</div>`;
  }
  return `<div class="board" role="img" aria-label="Cuadrícula de 7 por 7">${h}</div>`;
}
const LEVELS = [
  { n: 1, s: [0, 0], m: [["R", 2], ["D", 3]] },
  { n: 2, s: [0, 3], m: [["L", 1], ["D", 1], ["L", 1], ["D", 2], ["R", 2], ["D", 3]] },
  { n: 3, s: [0, 1], m: [["D", 4], ["R", 2], ["U", 2], ["R", 2], ["D", 3]] }
];
function pathPlay(host, lv) {
  const id = "path" + lv.n; Progress.register(id);
  const target = walk(lv.s, lv.m).pop();
  let trail = [lv.s], moves = [];
  const card = el("div", "card");
  card.innerHTML = `<h4>🧭 Misión ${lv.n}: ${sentence(lv.m)}.</h4><p>Lleva a 🧑 hasta 🎯. Cada clic mueve 1 cuadrado y tu camino se pinta de rojo.</p><div class="bd"></div>
  <div class="pad"><span></span><button class="btn alt" data-d="U" type="button" aria-label="Arriba">⬆️</button><span></span><span></span>
  <button class="btn alt" data-d="L" type="button" aria-label="Izquierda">⬅️</button><button class="btn alt" data-d="D" type="button" aria-label="Abajo">⬇️</button><button class="btn alt" data-d="R" type="button" aria-label="Derecha">➡️</button></div>
  <div class="row"><button class="btn gray" data-a="undo" type="button">↩️ Deshacer</button><button class="btn gray" data-a="reset" type="button">🔄 Reiniciar</button><button class="btn" data-a="ok" type="button">Verificar ✅</button></div><p class="fb" aria-live="polite"></p>`;
  const draw = () => { $(".bd", card).innerHTML = boardHtml(trail, trail[trail.length - 1], lv.s, target); };
  card.addEventListener("click", ev => {
    const b = ev.target.closest("button"); if (!b) return;
    const pos = trail[trail.length - 1];
    if (b.dataset.d) {
      const [dr, dc] = DIRS[b.dataset.d], nr = pos[0] + dr, nc = pos[1] + dc;
      if (nr < 0 || nc < 0 || nr >= N || nc >= N) { Sound.bad(); return; }
      Sound.pop(); trail.push([nr, nc]); moves.push(b.dataset.d); draw();
    } else if (b.dataset.a === "undo") { if (moves.length) { moves.pop(); trail.pop(); draw(); } }
    else if (b.dataset.a === "reset") { trail = [lv.s]; moves = []; draw(); }
    else if (b.dataset.a === "ok") {
      const ok = JSON.stringify(compress(moves)) === JSON.stringify(lv.m);
      const arrived = same(pos, target);
      verdict(card, ok, id, arrived ? "¡Llegaste, pero tu camino no sigue la instrucción! Léela paso a paso 📖" : "Todavía no llegas a 🎯. Revisa que hayas hecho todos los pasos 🧭");
    }
  });
  draw(); host.append(card);
}
function pathDescribe(host) {
  Progress.register("pathD");
  const s = [0, 1], m = [["R", 3], ["D", 2], ["L", 2], ["D", 3]], p = walk(s, m), end = p[p.length - 1];
  const card = el("div", "card");
  card.innerHTML = `<h4>✍️ Describe el movimiento de traslación que hizo 🧑 para llegar a 🎯.</h4>${boardHtml(p, s, s, end)}<textarea aria-label="Tu descripción" placeholder="Ejemplo: 1 cuadrado hacia arriba…"></textarea><div class="row"><button class="btn" type="button">Verificar ✅</button></div><p class="fb" aria-live="polite"></p>`;
  const groups = [["derecha"], ["izquierda"], ["abajo"], ["3", "tres"], ["2", "dos"]];
  $(".btn", card).onclick = () => {
    const t = norm($("textarea", card).value);
    if (t.trim().length < 6) { $(".fb", card).className = "fb bad"; $(".fb", card).textContent = "Escribe tu descripción primero ✏️"; return; }
    verdict(card, groups.every(g => g.some(w => t.includes(w))), "pathD", "Cuenta los cuadrados de cada tramo e indica hacia dónde va 🔎");
  };
  host.append(card);
}

/* ===== Laboratorio de movimientos ===== */
function lab(host) {
  const st = { x: 0, r: 0, f: 1 };
  const card = el("div", "card");
  card.innerHTML = `<h3>🧪 Laboratorio mágico</h3><p>Toca los botones y observa qué cambia y qué se queda igual.</p>
  <div class="stage"><span class="fig" id="labFig">🦆</span></div>
  <div class="row"><button class="btn alt" data-m="t" type="button">🛹 Trasladar</button><button class="btn" data-m="r" type="button">🎡 Rotar</button><button class="btn" data-m="f" type="button" style="background:#0e8a45">🪞 Reflejar</button><button class="btn gray" data-m="0" type="button">🔄 Reiniciar</button></div>
  <p class="fb" id="labMsg" aria-live="polite">¡Elige un movimiento!</p>`;
  const MSG = {
    t: "🛹 ¡Traslación! Cambió su lugar, pero sigue mirando igual y mide lo mismo.",
    r: "🎡 ¡Rotación! Giró alrededor de un punto. Cambió hacia dónde mira, pero su tamaño y forma son los mismos.",
    f: "🪞 ¡Reflexión! Se volteó como en un espejo. Queda «al revés», pero su tamaño y forma son los mismos."
  };
  card.addEventListener("click", ev => {
    const m = ev.target.closest("button")?.dataset.m; if (m === undefined) return;
    Sound.pop();
    if (m === "t") st.x = st.x >= 150 ? 0 : st.x + 50;
    if (m === "r") st.r += 90;
    if (m === "f") st.f *= -1;
    if (m === "0") Object.assign(st, { x: 0, r: 0, f: 1 });
    $("#labFig", card).style.transform = `translateX(${st.x}px) rotate(${st.r}deg) scaleX(${st.f})`;
    $("#labMsg", card).textContent = MSG[m] || "¡Todo de vuelta al inicio!";
  });
  host.append(card);
}

/* ===== Juego: Detective de movimientos ===== */
function detective(host) {
  Progress.register("det");
  const EM = ["🐄", "🚂", "🦆", "🐢", "🚗", "🦜", "✈️", "🐘"], ROUNDS = 8;
  const card = el("div", "card");
  let n, score, cur, busy;
  const make = () => {
    const k = pick(["t", "r", "f"]);
    const t = k === "t" ? "" : k === "r" ? `rotate(${pick([90, 180, 270])}deg)` : pick(["scaleX(-1)", "scaleY(-1)"]);
    return { k, t, e: pick(EM) };
  };
  const next = () => {
    if (n === ROUNDS) {
      const win = score >= 6; if (win) { Progress.award("det"); Sound.ok(); confetti(card); }
      card.innerHTML = `<h3>🕵️ ¡Caso cerrado!</h3><p class="score">Resolviste ${score} de ${ROUNDS} casos ${win ? "🏆" : "💪"}</p><p>${win ? "¡Eres un gran detective!" : "Juega otra vez para mejorar."}</p><div class="row"><button class="btn" type="button">🔁 Jugar otra vez</button></div>`;
      $(".btn", card).onclick = start; return;
    }
    cur = make(); busy = false;
    card.innerHTML = `<h3>🕵️ Detective de movimientos</h3><p>Caso ${n + 1} de ${ROUNDS}. ¿Qué movimiento hizo la figura?</p><div class="stem">${PAIR(cur.e, cur.t)}</div>
    <div class="row"><button class="btn alt" data-k="t" type="button">🛹 Traslación</button><button class="btn" data-k="r" type="button">🎡 Rotación</button><button class="btn" data-k="f" type="button" style="background:#0e8a45">🪞 Reflexión</button></div><p class="fb" aria-live="polite"></p>`;
  };
  const start = () => { n = 0; score = 0; next(); };
  card.addEventListener("click", ev => {
    const k = ev.target.closest("button")?.dataset.k; if (!k || busy) return;
    busy = true;
    const ok = k === cur.k, fb = $(".fb", card);
    fb.className = "fb " + (ok ? "ok" : "bad"); fb.textContent = ok ? "¡Correcto! 🎉" : "¡Uy! Ese no era 😅";
    if (ok) { score++; Sound.ok(); } else Sound.bad();
    n++; setTimeout(next, 900);
  });
  start(); host.append(card);
}

      <div class="mv r"><b>🎡 Rotación</b><br>La figura <b>gira</b> alrededor de un punto fijo llamado <b>centro de rotación</b>, como las manecillas de un reloj o una rueda de la fortuna.</div>

/* ===== Montaje ===== */
const BUILDERS = { choice: choiceItem, text: textItem, free: freeItem, w: (h, it) => it.f(h) };
function mount() {
  const app = $("#app"), nav = $("#nav");
  LESSON.forEach(s => {
    const sec = el("section"); sec.id = s.id;
    sec.append(el("h2", "", `${s.icon} ${s.title}`), el("div", "", s.intro));
    s.items.forEach(it => BUILDERS[it.k](sec, it));
    app.append(sec);
    nav.append(el("a", "", `${s.icon} ${s.title.split(":")[0]}`)); nav.lastChild.href = "#" + s.id;
  });
  Progress.paint();
  $("#mute").onclick = e => { Sound.on = !Sound.on; e.target.textContent = Sound.on ? "🔊 Sonido" : "🔇 Sin sonido"; };
}
mount();
</script>
